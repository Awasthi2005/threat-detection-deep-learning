<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Real-Time Cyber Threat Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="glass-card login-card">
            <div class="login-header">
                <div class="brand-icon" style="margin: 0 auto; width: 48px; height: 48px; font-size: 1.5rem;">🛡️</div>
                <h1>CyberThreat AI</h1>
                <p>Real-Time Deep Learning Intrusion Detection System</p>
            </div>

            <div id="errorMessage" class="error-alert">Invalid credentials. Try admin / admin123</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Enter username (e.g., admin)" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password (e.g., admin123)" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">Authenticate & Access Dashboard</button>
            </form>
            
            <div style="text-align: center; font-size: 0.75rem; color: var(--text-muted);">
                B.Tech CSE Final Year Project • Network Intrusion Detection System
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
